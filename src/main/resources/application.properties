# =============================================================================
# Contrat-bail — configuration Spring Boot
# =============================================================================

# --- Source de données --------------------------------------------------------
# Les valeurs restent surchargeables par variables d'environnement : c'est ce qui
# permet au docker-compose (base « ContratBail », mot de passe « postgres ») de
# démarrer l'application sans toucher à ce fichier.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/contratbail}
spring.datasource.username=postgres
spring.datasource.password=697131713251266642054
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ----------------------------------------------------------
# Le schéma fait autorité : il est créé par sql/240920260828-database_init.sql.
# « validate » vérifie que le mapping Hibernate (entités @Entity) est strictement
# conforme aux tables, y compris les types énumérés PostgreSQL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.format-sql=true

# --- Thymeleaf ----------------------------------------------------------------
# Les gabarits sont empaquetés dans le jar (src/main/resources/templates).
# Le dossier « template/ » qui existait à la racine du dépôt a été supprimé
# lors du déplacement : le préfixe par défaut de Spring Boot est donc
# « classpath:/templates/ ». THYMELEAF_PREFIX reste surchargeable pour
# travailler sur une copie externe sans reconstruire.
spring.thymeleaf.prefix=${THYMELEAF_PREFIX:classpath:/templates/}
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# --- Messages de validation ---------------------------------------------------
spring.messages.basename=ValidationMessages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --- Serveur ------------------------------------------------------------------
server.port=1404
server.error.include-message=always

# --- Sécurité des identités ---------------------------------------------------
# Coût BCrypt du hachage des mots de passe. 12 ≈ 250 ms de calcul par hachage :
# assez lent pour décourager une force brute, assez rapide pour une connexion.
# 4 = minimal accepté par la bibliothèque, 31 = maximal (plusieurs secondes).
bailtech.securite.cout-bcrypt=${BAILTECH_BCRYPT_COUT:12}

# Coffre chiffré des pièces administratives du profil (CIN numérisée, justificatif
# de domicile, etc.). AES-256-GCM, clé hors du dépôt.
# La clé est une chaîne Base64 de 32 octets ; la générer avec :
#   StockageSecuriseService.genererCle()
# En développement, laisser BAILTECH_CLE_CHIFFREMENT vide fait journaliser un
# avertissement au démarrage et le coffre refuse toute écriture — il n'écrit
# jamais en clair pour autant.
bailtech.securite.coffre=${BAILTECH_COFFRE:./coffre-securise}
bailtech.securite.cle-chiffrement=${BAILTECH_CLE_CHIFFREMENT:}

# --- Démonstration ------------------------------------------------------------
# Jeu de données injecté au démarrage uniquement si la base est vide.
bailtech.demo=${BAILTECH_DEMO:true}
bailtech.demo.desactiver=${BAILTECH_DEMO_DESACTIVER:false}
# Mot de passe appliqué aux comptes de démonstration. Il n'est jamais stocké en
# clair : seules des empreintes BCrypt à sel variable sont enregistrées.
# Surchargeable pour ne pas dépendre d'une valeur figée dans le code.
bailtech.demo.mot-de-passe=${BAILTECH_DEMO_MOT_DE_PASSE:Bailtech2026!}

# --- Profils de développement (src/main/resources/application-dev.properties) ---
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
