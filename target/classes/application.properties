# =============================================================================
# Contrat-bail — configuration Spring Boot
# =============================================================================

# --- Source de données --------------------------------------------------------
# Les valeurs restent surchargeables par variables d'environnement : c'est ce qui
# permet au docker-compose (base « ContratBail », mot de passe « postgres ») de
# démarrer l'application sans toucher à ce fichier.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/contratbail}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ----------------------------------------------------------
# Le schéma fait autorité : il est créé par sql/240920260828-database_init.sql.
# « validate » vérifie que le mapping Hibernate (entités @Entity) est strictement
# conforme aux tables, y compris les types énumérés PostgreSQL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.format-sql=true

# --- Thymeleaf ----------------------------------------------------------------
# Les gabarits versionnés à la racine du dépôt (dossier « template ») sont
# utilisés en priorité : ils sont modifiés en continu par l'équipe front.
# Spring Boot n'accepte qu'un préfixe unique ; positionnez THYMELEAF_PREFIX sur
# « classpath:/templates/ » pour basculer sur l'emplacement standard une fois les
# gabarits déplacés dans src/main/resources/templates.
spring.thymeleaf.prefix=${THYMELEAF_PREFIX:file:./template/}
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# --- Messages de validation ---------------------------------------------------
spring.messages.basename=ValidationMessages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --- Serveur ------------------------------------------------------------------
server.port=${PORT:8080}
server.error.include-message=always

# --- Démonstration ------------------------------------------------------------
# Jeu de données injecté au démarrage uniquement si la base est vide.
bailtech.demo=${BAILTECH_DEMO:true}
bailtech.demo.desactiver=${BAILTECH_DEMO_DESACTIVER:false}

# --- Profils de développement (src/main/resources/application-dev.properties) ---
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
