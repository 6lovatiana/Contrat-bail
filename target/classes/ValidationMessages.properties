# =============================================================================
# Messages de validation — Contrat-bail
# Ce fichier est le bundle de référence de MessageSource
# (spring.messages.basename=ValidationMessages). Les annotations JSR-380 y
# font référence par « {cle} », et les gabarits les affichent via th:errors.
# Langue : français (Madagascar).
# =============================================================================

