# =============================================================================
# Contrat-bail — configuration de développement
# Variables d'environnement surchargées ici si elles sont présentes.
# =============================================================================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/contratbail}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:1234}

# Gabarits rechargés à chaque requête pendant la mise au point du câblage.
spring.thymeleaf.cache=false
spring.jpa.show-sql=false

# Remplissage de la base au démarrage, uniquement si la table utilisateur est vide.
bailtech.demo=true
